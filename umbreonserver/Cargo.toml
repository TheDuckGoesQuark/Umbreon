[package]
name = "umbreonserver"
version = "0.1.0"
edition = "2021"

[dependencies]
umbreonproto = { path = "../umbreonproto" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11.1"
hex = "0.4.3"
getrandom = "0.4.3"
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
